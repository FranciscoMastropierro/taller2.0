name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: galante
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: galante_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galante"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://galante:synthetic-ci-password@localhost:5432/galante_test
      AUTH_SECRET: synthetic-ci-auth-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
